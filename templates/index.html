<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Abstractive News Summarization</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  </head>

  <body>
    <!-- Header -->
    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center">
        <h1>Abstractive News Summarization</h1>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
      </div>
    </div>

    <!-- URL Submission Form -->
    <div class="container mt-4">
      <form method="post">
        <div class="input-group">
          <input placeholder="Please enter a news URL" type="url" name='url' class="form-control" required>
          <div class="input-group-append">
            <button class="btn btn-secondary" type="submit">Summarize</button>
          </div>
        </div>
      </form>

      <!-- Error message display -->
      {% if error %}
        <div class="alert alert-danger mt-3" role="alert">
          {{ error }}
        </div>
      {% endif %}
    </div>

    <!-- Summary and Text Display -->
    {% if show_summary %}
    <div class="container mt-5" style="max-width:1500px;">
      <div class="row">
        <div class="col-12 text-center">
          <h3>Title: {{ title }}</h3>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-md-6">
          <h4 class="text-center">Original Article</h4>
          <textarea rows="18" class="form-control" readonly style="background:#f2f2f2;">{{ text }}</textarea>
        </div>

        <div class="col-md-6">
          <h4 class="text-center">Summarized Article</h4>
          <textarea rows="18" class="form-control" readonly style="background:#f2f2f2;">{{ summary }}</textarea>
        </div>
      </div>
    </div>
    {% endif %}

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  </body>
</html>
